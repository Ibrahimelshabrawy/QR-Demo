```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QR Speed Demo</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
      }

      .container {
        width: 90%;
        max-width: 900px;
        text-align: center;
      }

      #loading {
        font-size: 28px;
      }

      .spinner {
        width: 55px;
        height: 55px;
        margin: 0 auto 25px;
        border: 5px solid #444;
        border-top: 5px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #loadingText {
        font-size: 24px;
      }

      #image {
        display: none;
        max-width: 100%;
        max-height: 70vh;
        border-radius: 12px;
      }

      #result {
        display: none;
        margin-top: 20px;
      }

      .time {
        font-size: 28px;
        font-weight: bold;
      }

      .label {
        margin-top: 8px;
        font-size: 15px;
        color: #aaa;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading...</div>
      </div>

      <img id="image" alt="Result" />

      <div id="result">
        <div class="time"><span id="time">0</span> ms</div>

        <div class="label">Time consumed</div>
      </div>
    </div>

    <script>
      const loading = document.getElementById("loading");
      const loadingText = document.getElementById("loadingText");
      const image = document.getElementById("image");
      const result = document.getElementById("result");
      const timeElement = document.getElementById("time");

      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");

      const startTime = performance.now();

      function showImage(imagePath) {
        image.src = imagePath;

        image.onload = () => {
          const endTime = performance.now();
          const elapsedTime = Math.round(endTime - startTime);

          loading.style.display = "none";
          image.style.display = "block";

          timeElement.textContent = elapsedTime;
          result.style.display = "block";
        };
      }

      /*
       * FAST QR
       * Shows the fast image immediately.
       */
      if (mode === "fast") {
        showImage("fast.jpeg");
      } else if (mode === "slow") {
        /*
         * SLOW QR
         * Waits approximately 15 seconds
         * then shows the slow image.
         */
        let remaining = 15;

        loadingText.textContent = `Please wait ${remaining} seconds...`;

        const countdown = setInterval(() => {
          remaining--;

          if (remaining > 0) {
            loadingText.textContent = `Please wait ${remaining} seconds...`;
          } else {
            clearInterval(countdown);

            showImage("slow.webp");
          }
        }, 1000);
      } else {
        /*
         * Default
         */
        showImage("fast.jpg");
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QR Demo</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;

        background: radial-gradient(
          circle at top,
          #202020 0%,
          #111111 45%,
          #080808 100%
        );

        color: #ffffff;
      }

      .container {
        width: 100%;
        max-width: 850px;
        text-align: center;
      }

      /* Loading */

      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .spinner {
        width: 58px;
        height: 58px;

        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ffffff;

        border-radius: 50%;

        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }

      .loading-subtitle {
        margin-top: -14px;

        font-size: 14px;
        color: rgba(255, 255, 255, 0.5);
      }

      /* Result */

      #result {
        display: none;
      }

      .image-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      #image {
        display: block;

        max-width: 100%;
        max-height: 65vh;

        object-fit: contain;

        border-radius: 18px;

        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      }

      .result-info {
        margin-top: 28px;
      }

      .result-title {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 8px;
      }

      .time {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .unit {
        font-size: 18px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.55);
        margin-left: 4px;
      }

      /* Small screens */

      @media (max-width: 600px) {
        body {
          padding: 18px;
        }

        .loading-title {
          font-size: 20px;
        }

        #image {
          max-height: 60vh;
          border-radius: 14px;
        }

        .time {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <!-- Loading Screen -->

      <section id="loading">
        <div class="spinner"></div>

        <div class="loading-title">Loading...</div>

        <div class="loading-subtitle">
          Please wait while we prepare your content
        </div>
      </section>

      <!-- Result -->

      <section id="result">
        <div class="image-wrapper">
          <img id="image" alt="Result" />
        </div>

        <div class="result-info">
          <div class="result-title">Response Time</div>

          <div class="time">
            <span id="time">0</span>
            <span class="unit">ms</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");

      const image = document.getElementById("image");
      const timeElement = document.getElementById("time");

      const params = new URLSearchParams(window.location.search);

      const mode = params.get("mode");

      const startTime = performance.now();

      function showImage(imagePath) {
        image.src = imagePath;

        image.onload = () => {
          const endTime = performance.now();

          const elapsedTime = Math.round(endTime - startTime);

          loading.style.display = "none";

          result.style.display = "block";

          timeElement.textContent = elapsedTime;
        };
      }

      /*
       * FAST MODE
       */

      if (mode === "fast") {
        showImage("fast.jpeg");
      } else if (mode === "slow") {
        /*
         * SLOW MODE
         */
        // Just show the loading screen.
        // No countdown is displayed.

        setTimeout(() => {
          showImage("slow.webp");
        }, 15000);
      } else {
        /*
         * DEFAULT
         */
        showImage("fast.jpg");
      }
    </script>
  </body>
</html>
